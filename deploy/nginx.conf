# /etc/nginx/sites-available/pulsaipro.ru
#
# certbot переписывает этот файл при выпуске сертификата: добавляет блок на 443 и редирект.
# Здесь — состояние до сертификата: обычный HTTP и проксирование в Next.js на 127.0.0.1:3100.

server {
    listen 80;
    listen [::]:80;
    server_name pulsaipro.ru www.pulsaipro.ru;

    # Имена файлов под /_next/static содержат хеш содержимого, поэтому кешируются навсегда.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Поиск актива генерирует заметку через OpenAI, а он с российского IP отдаёт 403.
    # Это единственный пользовательский маршрут, которому нужен OpenAI, поэтому он один
    # уезжает на Vercel — туда же, где живёт вся остальная генерация. База у обоих общая,
    # так что созданная там заметка сразу видна на этом сайте.
    location /api/lookup {
        proxy_pass https://asset-attention.vercel.app;
        proxy_set_header Host asset-attention.vercel.app;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Крон-задачи выполняет Vercel, вызывая их по адресу своего деплоя. Снаружи на этом хосте
    # они не нужны никому: OpenAI отсюда всё равно недоступен, а открытый эндпоинт, который
    # запускает генерацию, — лишняя поверхность.
    location /api/cron/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 330s;
    }

    client_max_body_size 8m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss image/svg+xml;
    gzip_min_length 1024;
}
