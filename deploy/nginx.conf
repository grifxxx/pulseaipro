# /etc/nginx/sites-available/pulsaipro.ru
#
# certbot rewrites this file when it issues the certificate, adding the 443 server block and
# the redirect. What is here is the pre-certificate state: plain HTTP, proxying to the Next.js
# server on 127.0.0.1:3100.

server {
    listen 80;
    listen [::]:80;
    server_name pulsaipro.ru www.pulsaipro.ru;

    # Next.js emits content-hashed filenames under /_next/static, so they can be cached forever.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 330s;
    }

    # The cron endpoints generate an article on a strong model; a run takes about three minutes,
    # well past nginx's default 60s upstream timeout.
    location /api/cron/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    client_max_body_size 8m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss image/svg+xml;
    gzip_min_length 1024;
}
